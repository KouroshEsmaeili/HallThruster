[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hallthruster"
version = "0.18.5.dev0"
description = "Historical Python translation of HallThruster.jl v0.18.5-era code"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
landmark = ["pandas>=2.0"]
visualization = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/hallthruster/reactions" = [
    "reactions/*.dat",
    "reactions/CITATIONS.md",
]
"share/hallthruster/landmark" = ["landmark/landmark_rates.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
